<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apoca-llama Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050810;
      --surface: #090d1a;
      --surface2: #0a1628;
      --accent: #00d4ff;
      --accent-glow: rgba(0, 212, 255, 0.18);
      --accent2: #0066ff;
      --text: #e8f4ff;
      --text-muted: #5a7a9a;
      
      /* Server 1 Colors (Cyan/Blue Theme) */
      --s1-accent: #00d4ff;
      --s1-bubble: #0a1628;
      --s1-border: rgba(0, 212, 255, 0.25);
      
      /* Server 2 Colors (Purple/Pink Theme) */
      --s2-accent: #d946ef;
      --s2-bubble: #170a28;
      --s2-border: rgba(217, 70, 239, 0.25);
      
      --user-bubble: #07090f;
      --bot-bubble: #07090f; /* Base */
      --border: rgba(0, 212, 255, 0.1);
      --radius: 14px;
    }

    html,
    body {
      height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0, 212, 255, 0.07) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: -1;
    }

    #chat,
    #input-bar,
    .modal-overlay {
      position: relative;
      z-index: 1;
    }

    header {
      position: relative;
      z-index: 10;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ---- Header ---- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid rgba(0, 212, 255, 0.25);
      box-shadow: 0 1px 20px rgba(0, 212, 255, 0.08);
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header svg {
      width: 28px;
      height: 28px;
      fill: var(--accent);
      filter: drop-shadow(0 0 6px rgba(0, 212, 255, 0.6));
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: .82rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: color .2s, border-color .2s, background .2s, opacity 0.2s;
      background: var(--bg);
      cursor: pointer;
      font-family: inherit;
    }

    .header-btn:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    
    .header-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .header-btn.stop-btn {
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .header-btn.stop-btn:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* ---- Model Manager ---- */
    .model-manager {
      position: relative;
    }

    .model-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: .82rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .model-btn.s1 { border-color: var(--s1-border); }
    .model-btn.s2 { border-color: var(--s2-border); }

    .model-btn:hover.s1 { border-color: var(--s1-accent); }
    .model-btn:hover.s2 { border-color: var(--s2-accent); }

    .model-btn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }

    .model-btn .arrow {
      font-size: .6rem;
    }

    .model-panel {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
      z-index: 100;
      overflow: hidden;
    }
    
    /* Server 1 drops down left-aligned or right-aligned relative to button depending on space */
    #model-panel-s1 { left: 0; border-color: var(--s1-border); }
    #model-panel-s2 { right: 0; border-color: var(--s2-border); }

    .model-panel.open {
      display: block;
    }

    .model-panel-header {
      padding: 12px 16px;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
    }

    .model-list {
      max-height: 360px;
      overflow-y: auto;
    }

    .model-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background .15s;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .model-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    /* Active state for Server 1 */
    #model-list-s1 .model-item.active { background: rgba(0, 212, 255, 0.15); }
    /* Active state for Server 2 */
    #model-list-s2 .model-item.active { background: rgba(217, 70, 239, 0.15); }

    .model-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .model-dot.installed { background: #4ade80; }
    .model-dot.not-installed { background: #f87171; }

    .model-info {
      flex: 1;
      min-width: 0;
    }

    .model-name {
      font-size: .85rem;
      font-weight: 500;
    }

    .model-desc {
      font-size: .72rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .model-action {
      font-size: .72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity .2s;
    }

    .model-action:hover { opacity: .85; }
    .model-action.install { background: #4ade80; color: #0a0a0a; }
    .model-action.remove { background: #f87171; color: #0a0a0a; }
    .model-action:disabled { opacity: .4; cursor: not-allowed; }

    .model-progress { width: 100%; margin-top: 6px; }
    .model-progress-bar { height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; overflow: hidden; }
    
    .model-progress-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width .3s;
    }
    #model-list-s1 .model-progress-fill { background: var(--s1-accent); }
    #model-list-s2 .model-progress-fill { background: var(--s2-accent); }

    .model-progress-text { font-size: .68rem; color: var(--text-muted); margin-top: 3px; }

    /* ---- custom model input footer ---- */
    .model-panel-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
    }
    
    .ryo-input-wrap { display: flex; gap: 8px;}
    .ryo-input-wrap input {
        flex: 1;
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        padding: 6px 10px;
        font-family: inherit;
        font-size: 0.8rem;
    }
    .ryo-input-wrap button {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.8rem;
    }
    .ryo-input-wrap button:hover {
        background: rgba(255,255,255,0.1);
    }


    /* ---- Chat area ---- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface2) transparent;
    }

    .msg {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      animation: fadeUp .3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user { justify-content: flex-end; }
    .msg.server1 { justify-content: flex-start; }
    .msg.server2 { justify-content: flex-start; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
      font-weight: 600;
      flex-shrink: 0;
      color: #fff;
    }

    .msg.user .avatar {
      background: var(--accent2);
      box-shadow: 0 0 10px rgba(0, 102, 255, 0.5);
      order: 2;
    }
    
    .msg.server1 .avatar {
      background: var(--s1-bubble);
      border: 1px solid var(--s1-accent);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }

    .msg.server2 .avatar {
      background: var(--s2-bubble);
      border: 1px solid var(--s2-accent);
      box-shadow: 0 0 10px rgba(217, 70, 239, 0.3);
    }

    .bubble {
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: .935rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-width: calc(100% - 48px);
    }

    .msg.user .bubble {
      background: var(--user-bubble);
      border: 1px solid rgba(0, 102, 255, 0.25);
      border-bottom-right-radius: 4px;
    }

    .msg.server1 .bubble {
      background: var(--s1-bubble);
      border: 1px solid var(--s1-border);
      border-left: 3px solid var(--s1-accent);
      border-bottom-left-radius: 4px;
    }
    
    .msg.server2 .bubble {
      background: var(--s2-bubble);
      border: 1px solid var(--s2-border);
      border-right: 3px solid var(--s2-accent);
      border-bottom-left-radius: 4px; /* We keep left-aligned flow, but right border highlights it's the other server */
    }

    /* ---- Formatting inside bot bubbles ---- */
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: .8em 0 .4em; font-weight: 600; line-height: 1.3; }
    .bubble p { margin: .5em 0; }
    .bubble ul, .bubble ol { margin: .5em 0; padding-left: 1.4em; }
    .bubble li { margin: .25em 0; }
    .bubble code { background: rgba(255, 255, 255, 0.08); padding: 2px 6px; border-radius: 4px; font-size: .87rem; font-family: 'JetBrains Mono', monospace; }
    .bubble pre { background: #000; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 12px 16px; margin: .6em 0; overflow-x: auto; }
    .bubble pre code { background: none; padding: 0; color: #a5b4fc; }
    .msg.server1 .bubble pre code { color: #a5f3fc; }
    .msg.server2 .bubble pre code { color: #f9a8d4; }
    
    /* ---- Spinner ---- */
    .spinner-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid var(--surface2);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    
    .msg.server1 .spinner { border-top-color: var(--s1-accent); }
    .msg.server2 .spinner { border-top-color: var(--s2-accent); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { color: var(--text-muted); font-size: .875rem; }
    
    .ctx-banner {
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 10px 0;
      padding: 8px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
    }


    /* ---- Input bar ---- */
    #input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
    }

    #input-wrap {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .target-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      align-self: flex-start;
      margin-left: 2px;
    }
    
    .target-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    
    .radio-group {
      display: flex;
      gap: 8px;
    }
    
    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    
    .radio-label.s1.active { background: rgba(0, 212, 255, 0.1); border-color: var(--s1-accent); color: #fff;}
    .radio-label.s2.active { background: rgba(217, 70, 239, 0.1); border-color: var(--s2-accent); color: #fff; }
    
    .radio-label input[type="radio"] { display: none; }

    .textarea-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #prompt {
      flex: 1;
      resize: none;
      border: 1px solid rgba(0, 212, 255, 0.2);
      background: rgba(9, 13, 26, 0.9);
      color: var(--text);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-family: inherit;
      font-size: .935rem;
      line-height: 1.5;
      max-height: 160px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    #prompt:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.18), 0 0 16px rgba(0, 212, 255, 0.1);
    }

    #send {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--accent2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .15s, background .15s;
      flex-shrink: 0;
    }

    #send:hover:not(:disabled) { transform: scale(1.05); background: #005ce6; }
    #send:disabled { background: var(--surface2); color: var(--text-muted); cursor: not-allowed; }
    #send svg { width: 22px; height: 22px; fill: currentColor; }
  </style>
</head>

<body>

  <header>
    <div class="header-left">
      <svg viewBox="0 0 24 24">
         <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
      <h1>Apoca-llama</h1>
      <a href="https://cyberlessons101.com" target="_blank" class="header-btn" style="margin-left:8px; border-color:var(--border)">CyberLessons</a>
    </div>

    <div class="header-links">
      <!-- Ollama 1 Dropdown -->
      <div class="model-manager">
        <button class="model-btn s1" id="btn-toggle-s1">
          Server 1: <span id="label-active-s1">Loading...</span>
          <span class="arrow">▼</span>
        </button>
        <div class="model-panel" id="model-panel-s1">
          <div class="model-panel-header">Ollama 1 Models</div>
          <div class="model-list" id="list-s1"></div>
          <div class="model-panel-footer">
              <div class="ryo-input-wrap">
                  <input type="text" id="ryo-input-s1" placeholder="e.g. qwen2.5:3b" />
                  <button id="ryo-btn-s1">Pull</button>
              </div>
          </div>
        </div>
      </div>

      <!-- Ollama 2 Dropdown -->
      <div class="model-manager">
        <button class="model-btn s2" id="btn-toggle-s2">
          Server 2: <span id="label-active-s2">Loading...</span>
          <span class="arrow">▼</span>
        </button>
        <div class="model-panel" id="model-panel-s2">
          <div class="model-panel-header">Ollama 2 Models</div>
          <div class="model-list" id="list-s2"></div>
          <div class="model-panel-footer">
              <div class="ryo-input-wrap">
                  <input type="text" id="ryo-input-s2" placeholder="e.g. gemma2:2b" />
                  <button id="ryo-btn-s2">Pull</button>
              </div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <span id="ctx-counter" style="font-size: 0.8rem; color: var(--accent); font-family: 'JetBrains Mono', monospace; background: rgba(0, 212, 255, 0.05); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);">Ctx: 0 tokens</span>
      <button class="header-btn stop-btn" id="btn-stop" disabled>■ Stop Conversation</button>
      <button class="header-btn" id="btn-clear-ctx">Clear Context</button>
    </div>
  </header>

  <div id="chat">
    <div class="msg server1">
      <div class="avatar">S1</div>
      <div class="bubble">I am Server 1. We are both connected! Give one of us an initial prompt to start the conversation.</div>
    </div>
  </div>

  <div id="input-bar">
    <div id="input-wrap">
      <div class="target-controls">
        <span class="target-label">Send initial prompt to:</span>
        <div class="radio-group">
          <label class="radio-label s1 active" id="label-target-s1">
            <input type="radio" name="target" value="1" checked /> Server 1
          </label>
          <label class="radio-label s2" id="label-target-s2">
            <input type="radio" name="target" value="2" /> Server 2
          </label>
        </div>
      </div>
      <div class="textarea-row">
        <textarea id="prompt" rows="1" placeholder="Send an initial prompt to kick things off..."></textarea>
        <button id="send" title="Send">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" /></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Config
    const S1_API = '/api/server1';
    const S2_API = '/api/server2';

    // State
    const state = {
      s1: { activeModel: null, installed: new Set() },
      s2: { activeModel: null, installed: new Set() },
      isConversing: false,
      stopRequested: false,
      history: [] // shared context window
    };

    // UI Elements
    const chatEl = document.getElementById('chat');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const stopBtn = document.getElementById('btn-stop');
    const clearCtxBtn = document.getElementById('btn-clear-ctx');
    
    // Model Manager UI
    const mtS1 = document.getElementById('btn-toggle-s1');
    const mtS2 = document.getElementById('btn-toggle-s2');
    const mpS1 = document.getElementById('model-panel-s1');
    const mpS2 = document.getElementById('model-panel-s2');
    
    // Known general models to display
    const KNOWN_MODELS = [
      'llama3.2:1b', 'qwen2.5:3b', 'deepseek-r1:1.5b', 'gemma2:2b', 'stablelm2:1.6b', 'phi3.5:latest'
    ];

    // ==========================================
    // Core HTML formatting
    // ==========================================
    function appendMsg(role, text) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      
      let badge = 'U';
      if(role === 'server1') badge = 'S1';
      else if(role === 'server2') badge = 'S2';
      avatar.textContent = badge;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (role.startsWith('server')) {
        bubble.innerHTML = marked.parse(text);
      } else {
        bubble.textContent = text;
      }
      wrap.append(avatar, bubble);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return wrap;
    }

    function appendSpinner(role) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'server1' ? 'S1' : 'S2';

      const sw = document.createElement('div');
      sw.className = 'spinner-wrap';
      sw.innerHTML = '<div class="spinner"></div><span class="spinner-text">Thinking…</span>';

      wrap.append(avatar, sw);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return wrap;
    }

    // ==========================================
    // Context Management
    // ==========================================
    clearCtxBtn.addEventListener('click', () => {
      // Clear history array
      state.history = [];
      document.getElementById('ctx-counter').textContent = 'Ctx: 0 tokens';
      const banner = document.createElement('div');
      banner.className = 'ctx-banner';
      banner.textContent = 'Context Cleared — The next prompt starts a fresh conversation.';
      chatEl.appendChild(banner);
      chatEl.scrollTop = chatEl.scrollHeight;
    });

    // ==========================================
    // Model Management
    // ==========================================
    mtS1.addEventListener('click', e => { e.stopPropagation(); mpS1.classList.toggle('open'); mpS2.classList.remove('open'); });
    mtS2.addEventListener('click', e => { e.stopPropagation(); mpS2.classList.toggle('open'); mpS1.classList.remove('open'); });
    document.addEventListener('click', () => { mpS1.classList.remove('open'); mpS2.classList.remove('open'); });
    mpS1.addEventListener('click', e => e.stopPropagation());
    mpS2.addEventListener('click', e => e.stopPropagation());

    async function fetchModels(serverConfigKey, apiUrl, listElId, labelElId) {
      try {
        const res = await fetch(`${apiUrl}/tags`);
        const data = await res.json();
        state[serverConfigKey].installed = new Set((data.models || []).map(m => m.name));
      } catch (err) {
        console.warn(`Failed to fetch models for ${serverConfigKey}`, err);
        state[serverConfigKey].installed = new Set();
      }
      
      const serverState = state[serverConfigKey];
      if (!serverState.activeModel || !serverState.installed.has(serverState.activeModel)) {
        if (serverState.installed.has('qwen2.5:3b')) {
            serverState.activeModel = 'qwen2.5:3b';
        } else if (serverState.installed.size > 0) {
            serverState.activeModel = Array.from(serverState.installed)[0];
        } else {
            serverState.activeModel = null;
        }
      }
      
      document.getElementById(labelElId).textContent = serverState.activeModel || 'None';
      renderModelList(serverConfigKey, apiUrl, listElId, labelElId);
    }

    function renderModelList(serverKey, apiUrl, listElId, labelElId) {
      const listEl = document.getElementById(listElId);
      listEl.innerHTML = '';
      const serverState = state[serverKey];
      
      const allToRender = new Set([...KNOWN_MODELS, ...Array.from(serverState.installed)]);

      allToRender.forEach(modelName => {
        const installed = serverState.installed.has(modelName);
        const isActive = modelName === serverState.activeModel;

        const item = document.createElement('div');
        item.className = 'model-item' + (isActive ? ' active' : '');

        const dot = document.createElement('div');
        dot.className = 'model-dot ' + (installed ? 'installed' : 'not-installed');

        const info = document.createElement('div');
        info.className = 'model-info';
        info.innerHTML = `<div class="model-name">${modelName}</div>`;
        
        // Clicks to activate
        info.addEventListener('click', () => {
          if (installed) {
            serverState.activeModel = modelName;
            document.getElementById(labelElId).textContent = modelName;
            renderModelList(serverKey, apiUrl, listElId, labelElId);
          }
        });

        const actionBtn = document.createElement('button');
        actionBtn.className = 'model-action ' + (installed ? 'remove' : 'install');
        actionBtn.textContent = installed ? 'Remove' : 'Install';

        const progress = document.createElement('div');
        progress.className = 'model-progress';
        progress.style.display = 'none';
        progress.innerHTML = `<div class="model-progress-bar"><div class="model-progress-fill"></div></div><div class="model-progress-text">Starting...</div>`;

        actionBtn.addEventListener('click', async () => {
          if (installed) {
            actionBtn.disabled = true; actionBtn.textContent = 'Removing...';
            try { await fetch(`${apiUrl}/delete`, { method: 'DELETE', body: JSON.stringify({ name: modelName }) }); } catch(e){}
            fetchModels(serverKey, apiUrl, listElId, labelElId);
          } else {
            actionBtn.disabled = true; actionBtn.textContent = 'Pulling...';
            progress.style.display = 'block';
            const progressFill = progress.querySelector('.model-progress-fill');
            const progressText = progress.querySelector('.model-progress-text');
            try { 
                const res = await fetch(`${apiUrl}/pull`, { 
                    method: 'POST', 
                    body: JSON.stringify({ name: modelName, stream: true }) 
                });
                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line);
                            if (data.status) {
                                let text = data.status;
                                let pct = 0;
                                if (data.total && data.completed) {
                                    pct = Math.round((data.completed / data.total) * 100);
                                    text = `${data.status} (${pct}%)`;
                                    progressFill.style.width = `${pct}%`;
                                }
                                progressText.textContent = text;
                            }
                        } catch(e) {}
                    }
                }
            } catch(e){
                progressText.textContent = 'Error pulling model';
            }
            fetchModels(serverKey, apiUrl, listElId, labelElId);
          }
        });

        item.append(dot, info, actionBtn);
        item.appendChild(progress);
        listEl.appendChild(item);
      });
    }

    // Setup RYO buttons
    document.getElementById('ryo-btn-s1').addEventListener('click', () => {
        const val = document.getElementById('ryo-input-s1').value.trim();
        if(val) pullModel('s1', S1_API, val, 'list-s1', 'label-active-s1', 'ryo-btn-s1', 'ryo-input-s1');
    });
    document.getElementById('ryo-btn-s2').addEventListener('click', () => {
        const val = document.getElementById('ryo-input-s2').value.trim();
        if(val) pullModel('s2', S2_API, val, 'list-s2', 'label-active-s2', 'ryo-btn-s2', 'ryo-input-s2');
    });

    async function pullModel(serverKey, apiUrl, modelName, listId, labelId, btnId, inputId) {
        const btn = document.getElementById(btnId);
        btn.disabled = true;
        btn.textContent = '...';
        try {
             const res = await fetch(`${apiUrl}/pull`, { method: 'POST', body: JSON.stringify({ name: modelName, stream: true }) });
             const reader = res.body.getReader();
             const decoder = new TextDecoder("utf-8");
             while (true) {
                 const { done, value } = await reader.read();
                 if (done) break;
                 const chunk = decoder.decode(value, { stream: true });
                 const lines = chunk.split('\n');
                 for (const line of lines) {
                     if (!line.trim()) continue;
                     try {
                         const data = JSON.parse(line);
                         if (data.total && data.completed) {
                             const pct = Math.round((data.completed / data.total) * 100);
                             btn.textContent = `${pct}%`;
                         } else if (data.status) {
                             btn.textContent = 'Wait...';
                         }
                     } catch(e) {}
                 }
             }
             document.getElementById(inputId).value = '';
        }catch(e) {}
        btn.disabled = false;
        btn.textContent = 'Pull';
        fetchModels(serverKey, apiUrl, listId, labelId);
    }
    

    // Initialize Models
    setTimeout(() => {
        fetchModels('s1', S1_API, 'list-s1', 'label-active-s1');
        fetchModels('s2', S2_API, 'list-s2', 'label-active-s2');
    }, 1000);


    // ==========================================
    // Interaction UI 
    // ==========================================
    const radios = document.querySelectorAll('input[name="target"]');
    radios.forEach(r => r.addEventListener('change', (e) => {
      document.getElementById('label-target-s1').classList.remove('active');
      document.getElementById('label-target-s2').classList.remove('active');
      if (e.target.value === '1') document.getElementById('label-target-s1').classList.add('active');
      else document.getElementById('label-target-s2').classList.add('active');
    }));

    promptEl.addEventListener('input', () => {
      promptEl.style.height = 'auto';
      promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
    });

    promptEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); startConversation(); }
    });
    
    sendBtn.addEventListener('click', startConversation);
    stopBtn.addEventListener('click', () => {
       state.stopRequested = true;
       stopBtn.textContent = 'Stopping...';
       stopBtn.disabled = true;
    });

    // ==========================================
    // Logic Loop
    // ==========================================
    async function startConversation() {
      const initialPrompt = promptEl.value.trim();
      if (!initialPrompt) return;
      if (!state.s1.activeModel || !state.s2.activeModel) {
          alert('Both servers must have an active model loaded models!');
          return;
      }
      
      const targetVal = document.querySelector('input[name="target"]:checked').value;
      const initialServer = targetVal === '1' ? 'server1' : 'server2';

      // UI updates
      promptEl.value = '';
      promptEl.style.height = 'auto';
      sendBtn.disabled = true;
      promptEl.disabled = true;
      stopBtn.disabled = false;
      stopBtn.textContent = '■ Stop Conversation';
      
      state.isConversing = true;
      state.stopRequested = false;

      // Add user prompt to screen AND history
      appendMsg('user', initialPrompt);
      state.history.push({ role: 'user', content: initialPrompt });

      // Enter loop
      await conversationLoop(initialServer);
      
      // Teardown once loop exits
      state.isConversing = false;
      sendBtn.disabled = false;
      promptEl.disabled = false;
      stopBtn.disabled = true;
      stopBtn.textContent = '■ Stop Conversation';
      promptEl.focus();
    }

    async function conversationLoop(currentServerRaw) {
       let currentServer = currentServerRaw; // 'server1' or 'server2'
       
       while(state.isConversing && !state.stopRequested) {
           
           const apiUrl = currentServer === 'server1' ? S1_API : S2_API;
           const srvKey = currentServer === 'server1' ? 's1' : 's2';
           const activeModel = state[srvKey].activeModel;

           const spinner = appendSpinner(currentServer);
           let responseText = '';

           try {
                // Keep the context window size reasonable
                if (state.history.length > 20) {
                    state.history = state.history.slice(-20);
                }

               // Format history for THIS server's perspective
               // The Ollama API expects alternations of user/assistant/user/assistant
               // In a ping pong, the last message from the OTHER server is the "user" prompt to THIS server.
               // So we just take the global history array which is already formatted as {role: 'user', content: ...} 
               // and send it.
               
               const res = await fetch(`${apiUrl}/chat`, {
                   method: 'POST',
                   headers: { 'Content-Type': 'application/json' },
                   body: JSON.stringify({
                       model: activeModel,
                       messages: state.history,
                       stream: false
                   })
               });
               
               if (!res.ok) throw new Error(`API request failed: ${res.status}`);
               const data = await res.json();
               responseText = data.message?.content || '(Empty)';
               
               if (data.prompt_eval_count) {
                   document.getElementById('ctx-counter').textContent = `Ctx: ${data.prompt_eval_count} tokens`;
               }
               
           } catch (e) {
               spinner.remove();
               appendMsg(currentServer, '⚠️ Error hitting endpoint. Interaction halted. ' + e.message);
               break; 
           }

           spinner.remove();
           if(state.stopRequested) break;

           appendMsg(currentServer, responseText);
           
           // For the NEXT iteration (which will be the OTHER server), 
           // the response we just got becomes the 'user' prompt.
           // However, if we look at a standard chat, the API returns it as 'assistant'.
           // If we append it as 'assistant', the NEXT server will see: user -> assistant. 
           // But it needs a 'user' prompt to reply to! 
           // So we'll append THIS response as the new 'user' message for the global history.
           
           state.history.push({ role: 'user', content: responseText });
           
           currentServer = currentServer === 'server1' ? 'server2' : 'server1';
           
           // Slight delay so the UI breathes
           await new Promise(r => setTimeout(r, 1500));
       }
    }

  </script>
